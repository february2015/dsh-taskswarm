# dsh-buju bundle patch — mounts the Buju orchestrator on any profile that
# composes the base services (commands, tools, agents).
#
# Add "dsh-buju" to the profile's dsh.profile.bundles to activate /orch-family
# commands. Config overrides can be layered here, e.g.:
#
#   - id: buju-orchestrator
#     config:
#       tasksRoot: docs/task-management
#
- insert:
    - id: buju-orchestrator
      name: 'dsh-buju/orchestrator'
