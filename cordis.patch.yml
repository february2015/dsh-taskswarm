# taskswarm bundle patch — mounts the TaskSwarm orchestrator on any profile that
# composes the base services (commands, tools, agents).
#
# Add "taskswarm" to the profile's dsh.profile.bundles to activate /orch-family
# commands. Config overrides can be layered here, e.g.:
#
#   - id: taskswarm-orchestrator
#     config:
#       tasksRoot: docs/task-management
#
- insert:
    - id: taskswarm-orchestrator
      name: 'dsh-taskswarm/orchestrator'
